- id: make-exception-with-current-stack
  name: MakeExceptionWithCurrentStack
  source: UnrealHog/Source/UnrealHog/Public/Utilities/PostHogExceptionLibrary.h
  implementation: UnrealHog/Source/UnrealHog/Private/Utilities/PostHogExceptionLibrary.cpp
  category: Error Tracking
  summary: Creates an exception input with the current Blueprint or native C++ call stack.
  signature: |
    static FPostHogExceptionInput MakeExceptionWithCurrentStack(
        const FString& Message,
        const FString& Type,
        bool bHandled = true);
  parameters:
    - name: Message
      type: const FString&
      required: true
      description: Human-readable description of the failure.
    - name: Type
      type: const FString&
      required: true
      description: Stable category for the failure.
    - name: bHandled
      type: bool
      required: false
      description: Whether application code handled the failure. Defaults to true.
  outputs:
    - type: FPostHogExceptionInput
      description: Exception details containing a best-effort call stack captured at the call site.
  notes:
    - Include Utilities/PostHogExceptionLibrary.h in C++.
    - This helper only creates an in-memory value. Pass the result to CaptureException to capture an event.
    - Native stack symbols, file names, line numbers, and nonempty output are not guaranteed in optimized builds.

