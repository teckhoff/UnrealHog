- id: set-analytics-opt-in
  name: SetAnalyticsOptIn
  source: UnrealHog/Source/UnrealHog/Public/Subsystems/PostHogRuntimeSubsystem.h
  implementation: UnrealHog/Source/UnrealHog/Private/Subsystems/PostHogRuntimeSubsystem.cpp
  category: Consent and Delivery
  summary: Changes analytics collection consent; successful opt-in and later opt-out transitions are persisted for future launches.
  signature: |
    void SetAnalyticsOptIn(bool bOptIn);
  parameters:
    - name: bOptIn
      type: bool
      required: true
      description: Whether analytics collection should be enabled. Opting out also clears queued events.
  outputs:
    - type: void
      description: This method does not return a value.
  notes:
    - A persisted choice takes precedence over the Default User Opt-In project setting on later launches.
    - Opt-in can remain disabled when project settings are invalid or the developer kill switch is off; call IsAnalyticsOptedIn and inspect the UnrealHog log to confirm the effective state.
    - Work attempted before opt-in is dropped rather than deferred.

