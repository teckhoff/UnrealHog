    - name: InBeforeSend
      type: FPostHogBeforeSendDelegate
      required: true
      description: Delegate invoked before an event is persisted.
  outputs:
    - type: void
      description: This method does not return a value.
  notes:
    - Include Events/PostHogBeforeSend.h.
    - Return EPostHogBeforeSendResult::Continue to persist the event, Drop to discard it intentionally, or Failure to reject it as a hook failure.
    - The callback is synchronous and receives an FPostHogBeforeSendEvent whose mutable properties can be edited before persistence.

