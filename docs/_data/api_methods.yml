- id: flush-and-quit
  name: FlushAndQuit
  source: UnrealHog/Source/UnrealHog/Public/Subsystems/PostHogRuntimeSubsystem.h
  implementation: UnrealHog/Source/UnrealHog/Private/Subsystems/PostHogRuntimeSubsystem.cpp
  category: Consent and Delivery
  summary: Gives queued events a bounded opportunity to drain, then asks the engine to exit.
  signature: |
    void FlushAndQuit();
  parameters: []
  outputs:
    - type: void
      description: This method does not return a value.
  notes:
    - This method does not guarantee network delivery. Exit is requested when the queue drains or the configured timeout is reached.
