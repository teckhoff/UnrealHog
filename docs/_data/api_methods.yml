  source: UnrealHog/Source/UnrealHog/Public/Events/PostHogEventProperties.h
  implementation: UnrealHog/Source/UnrealHog/Private/Events/PostHogEventProperties.cpp
  category: Events and Properties
  summary: Adds a string value to a property object or property array and returns the same builder for chaining.
  signature: |
    UPostHogEventProperties* AddString(const FString& Key, const FString& StringValue);
    UPostHogEventPropertyArray* AddString(const FString& StringValue);
  parameters:
    - name: Key
      type: const FString&
      required: false
      required_label: EventProperties only
      description: The property name when calling this on UPostHogEventProperties. Not used by UPostHogEventPropertyArray.
    - name: StringValue
      type: const FString&
      required: true
      description: The string value to store or append.
  outputs:
    - type: UPostHogEventProperties* or UPostHogEventPropertyArray*
      description: The same builder instance, for chaining additional Add calls.
  notes:
    - Use UPostHogEventProperties when adding keyed fields to an event property object.
    - Use UPostHogEventPropertyArray when appending ordered, unkeyed values to an array.
