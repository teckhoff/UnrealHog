name: PR body validation

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  validate:
    name: PR body validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate published pull request metadata
        run: python3 Scripts/validate_pr_body.py --event "$GITHUB_EVENT_PATH"
